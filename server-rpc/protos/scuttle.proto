syntax = "proto3";

package scuttle;

// Scuttle operator service, exposed only on the existing privileged admin listener.
service ScuttleService {
	rpc ReconcileLightningAttempt(ReconcileLightningAttemptRequest) returns (ReconcileLightningAttemptResponse) {}
}

message ReconcileLightningAttemptRequest {
	int64 attempt_id = 1000;
}

message ReconcileLightningAttemptResponse {
	int64 attempt_id = 1000;
	bytes payment_hash = 1001;
	string status = 1002;
}
