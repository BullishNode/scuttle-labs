# Warns after `period`, kills after `terminate-after` additional periods.
# e.g. period = "60s", terminate-after = 3 => warns at 60s, kills at 4*60s = 240s.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# The two explicit ignored scale cases retain their existing limits.
[[profile.default.overrides]]
filter = 'binary(server) and test(=payouts::expiry_oversize::expiry_bounded_round_inventory_splits_and_pays_every_owner)'
slow-timeout = { period = "60s", terminate-after = 60 }

[[profile.default.overrides]]
filter = 'binary(server) and test(=payouts::expiry_oversize::expiry_automatic_real_limit_multilevel_split_pays_every_owner)'
slow-timeout = { period = "60s", terminate-after = 29 }

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci-merge-train]
slow-timeout = { period = "60s", terminate-after = 5 }
retries = 3
